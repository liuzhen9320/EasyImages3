name: PHP tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['5.6', '7.4', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Lint PHP files
        run: git ls-files -z '*.php' | xargs -0 -n1 php -l

      - name: Bootstrap smoke test
        run: |
          # shellcheck disable=SC2016
          php -r 'require "app/function.php"; if (!isset($config) || !is_array($config)) { exit(1); }'

      - name: Test installation and authentication flow
        run: bash tests/authentication_flow.sh

      - name: Test file manager CSRF protection
        run: bash tests/file_manager_csrf.sh

      - name: Test file manager remote upload rejection
        run: bash tests/file_manager_remote_upload.sh

      - name: Test SVG upload rejection
        run: bash tests/svg_upload_rejection.sh

      - name: Test trusted proxy IP handling
        run: bash tests/trusted_proxy_ip.sh

      - name: Test deletion path containment
        run: bash tests/deletion_path_containment.sh

      - name: Test log viewer path containment
        run: bash tests/log_viewer_path_containment.sh
